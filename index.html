<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Sandbox Multiplayer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            z-index: 100;
            min-width: 200px;
        }

        #wallet-info {
            margin-bottom: 10px;
        }

        #wallet-id {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #4CAF50;
            word-break: break-all;
        }

        #stamina-container {
            margin: 10px 0;
        }

        #stamina-label {
            font-size: 12px;
            margin-bottom: 5px;
        }

        #stamina-bar {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        #stamina-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.3s ease;
        }

        #controls {
            margin-top: 15px;
        }

        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 10px;
            transition: background 0.3s;
        }

        button:hover {
            background: #1976D2;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        #connect-btn {
            background: #4CAF50;
        }

        #connect-btn:hover {
            background: #45a049;
        }

        #status {
            margin-top: 10px;
            font-size: 11px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="hud">
        <div id="wallet-info">
            <div style="font-size: 11px; color: #aaa; margin-bottom: 5px;">Wallet:</div>
            <div id="wallet-id">Not connected</div>
        </div>
        <div id="stamina-container">
            <div id="stamina-label">Stamina: <span id="stamina-value">100</span>/100</div>
            <div id="stamina-bar">
                <div id="stamina-fill"></div>
            </div>
        </div>
        <div id="controls">
            <button id="connect-btn">Connect MetaMask</button>
            <button id="grid-toggle">Toggle Grid</button>
        </div>
        <div id="status">Players: <span id="player-count">0</span>/8</div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
